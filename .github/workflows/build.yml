name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build & test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: restore
        run: dotnet restore WinFence.sln

      - name: build (Release)
        run: dotnet build WinFence.sln -c Release --no-restore --nologo /warnaserror

      - name: test
        run: dotnet test WinFence.sln -c Release --no-build --nologo --logger "console;verbosity=normal"

  publish:
    name: publish self-contained release
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: publish (self-contained, single file)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $out = "publish/WinFence-$version-win-x64"
          dotnet publish src/WinFence.App `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -o $out `
            --nologo
          Write-Host "Published to $out"
          Get-ChildItem $out | Select-Object Name, Length

      - name: zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $src = "publish/WinFence-$version-win-x64"
          $dst = "publish/WinFence-$version-win-x64.zip"
          Compress-Archive -Path $src -DestinationPath $dst -Force
          Get-Item $dst | Select-Object Name, Length

      - name: upload release asset
        uses: softprops/action-gh-release@v2
        with:
          name: "WinFence ${{ github.ref_name }}"
          body: |
            ## WinFence ${{ github.ref_name }}

            Self-contained Windows x64 build — **no .NET runtime required**.

            ### Run
            1. Download `WinFence-${{ github.ref_name }}-win-x64.zip`
            2. Unzip anywhere
            3. Double-click `WinFence.App.exe`

            ### Notes
            - Alpha build, expect rough edges
            - See [PLAN.md](https://github.com/wealthforme/WinFence/blob/main/PLAN.md) for the roadmap
          files: |
            publish/WinFence-${{ github.ref_name }}-win-x64.zip
          fail_on_unmatched_files: true
